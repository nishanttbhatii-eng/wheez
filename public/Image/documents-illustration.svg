<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" fill="none" aria-hidden="true">
  <!-- Desk -->
  <rect x="70" y="248" width="230" height="12" rx="2" fill="#1a1a1a"/>
  <rect x="90" y="260" width="14" height="70" fill="#1a1a1a"/>
  <rect x="266" y="260" width="14" height="70" fill="#1a1a1a"/>

  <!-- Yellow folder on floor -->
  <path d="M48 300h52l10 30H38l10-30z" fill="#FFD200" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M48 300h20l6 8H42l6-8z" fill="#FFE566" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Floating docs -->
  <g transform="translate(290 40)">
