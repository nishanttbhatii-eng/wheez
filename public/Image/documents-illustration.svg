    <path d="M28 2v6M28 48v6M2 28h6M48 28h6M8.5 8.5l4.2 4.2M43.3 43.3l4.2 4.2M8.5 47.5l4.2-4.2M43.3 12.7l4.2-4.2" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 29l5 5 11-12" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Seated person left -->
